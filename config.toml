[airplay]
# Name shown on the iPhone Screen Mirroring list
server_name = "airplay2-rust"

# --- Preview quality (real encode, NOT simulated) ---
# The receiver cannot invent sharpness. The iPhone picks H.264 bitrate from the
# display size we advertise. Larger size ≈ sharper / heavier Wi‑Fi.
#
# quality presets (portrait-first for home UI):
#   low    =  720 x 1280 @ 30   (smooth / weak Wi‑Fi)
#   medium = 1080 x 1920 @ 60
#   high   = 1170 x 2532 @ 60   ← default high-quality preview
#   ultra  = 1290 x 2796 @ 60   (max; needs strong Wi‑Fi + phone)
#   custom = use width / height / fps below
quality = "custom"
refresh_rate = 60

# Only used when quality = "custom":
 width = 1280
 height = 720
 fps = 60

# After changing quality: stop app, restart, then disconnect & re-mirror on the phone.

[player]
implementation = "gstreamer"
output = "dump.h264"
# balanced keeps A/V sink sync; low-latency still syncs sinks (leaky queues only).
preview_mode = "balanced"
hardware_decode = true

# Legacy orientation controls for ffplay/processed renderers. The direct
# GStreamer D3D11 preview intentionally bypasses crop/rotation processing.
auto_rotate = true
rotate = "auto"
detect_game = true
# AirPlay volume: player (GStreamer gain) | system | disabled
volume_sync = "player"
