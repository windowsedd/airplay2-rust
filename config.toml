[airplay]
# Name shown on the iPhone Screen Mirroring list
server_name = "airplay2-rust"

# --- Quality (no separate "bitrate" on the receiver) ---
# The iPhone encodes H.264 based on what we advertise here:
#   larger width/height  => typically higher bitrate / sharper picture
#   higher fps           => smoother motion (up to what Wi-Fi allows)
# After changing these: stop the app, restart, then disconnect & re-mirror on the phone.
width = 1920
height = 1080
fps = 60
refresh_rate = 60

# Lower quality / less Wi-Fi load (uncomment if stream is choppy):
# width = 1280
# height = 720
# fps = 30

[player]
# auto = GStreamer live window + dump.h264 (ffplay only if GStreamer fails — one window)
# Also: gstreamer | ffmpeg | h264-dump | vlc
implementation = "auto"
output = "dump.h264"
