[workspace]
resolver = "2"
members = [
    "crates/airplay-lib",
    "crates/airplay-server",
    "crates/airplay-player",
    "crates/airplay-client",
    "crates/airplay-app",
]
# `cargo run` from the workspace root starts the receiver (GStreamer by default).
default-members = ["crates/airplay-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/airplay2-rust"

[workspace.dependencies]
airplay-lib = { path = "crates/airplay-lib" }
airplay-server = { path = "crates/airplay-server" }
airplay-player = { path = "crates/airplay-player", default-features = false }
airplay-client = { path = "crates/airplay-client" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
bytes = "1"

# FairPlay OmgHax/HandGarble relies on Java-style silent i32 wraparound.
[profile.dev]
overflow-checks = false

[profile.test]
overflow-checks = false
