[package]
name = "airplay-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "airplay-app"
path = "src/main.rs"

[features]
# Default: GStreamer (live A/V) + dump + ffplay fallback.
# Windows: need GStreamer MSVC + pkg-config (see .cargo/config.toml and .\run.ps1).
# Without GStreamer install: cargo run --no-default-features --features "h264-dump,ffmpeg"
default = ["h264-dump", "ffmpeg", "gstreamer"]
h264-dump = ["airplay-player/h264-dump"]
gstreamer = ["airplay-player/gstreamer"]
ffmpeg = ["airplay-player/ffmpeg"]
vlc = ["airplay-player/vlc"]

[dependencies]
airplay-server = { workspace = true }
# Inherit player features from this package's feature flags (not player defaults alone).
airplay-player = { workspace = true, default-features = false }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# System tray (taskbar) menu
tray-icon = "0.19"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
