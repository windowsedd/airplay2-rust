[airplay]
server_name = "airplay2-rust"
# Preview quality: low | medium | high | ultra | custom (real size, not simulated bitrate)
quality = "high"
refresh_rate = 60
# custom only:
# width = 1170
# height = 2532
# fps = 60

[player]
implementation = "auto"
output = "dump.h264"
preview_mode = "balanced"
hardware_decode = true
# Legacy orientation controls for ffplay/processed renderers. Direct GStreamer
# preview preserves the encoded frame and ignores crop/rotation processing.
auto_rotate = true
rotate = "auto"
detect_game = true
# AirPlay volume: player (GStreamer gain) | system | disabled
volume_sync = "player"
