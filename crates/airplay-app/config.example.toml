[airplay]
server_name = "airplay2-rust"
width = 1280
height = 720
fps = 24

[player]
# h264-dump | gstreamer | ffmpeg | vlc
# Default build already enables gstreamer — plain `cargo run` opens a window.
# File-only dump:
#   cargo run --no-default-features --features h264-dump
#   implementation = "h264-dump"
implementation = "gstreamer"
# Used by h264-dump only
output = "dump.h264"
