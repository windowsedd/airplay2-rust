[airplay]
server_name = "airplay2-rust"
width = 1280
height = 720
fps = 24

[player]
# h264-dump | gstreamer | ffmpeg | vlc
# Live window (recommended):
#   cargo run -p airplay-app --features gstreamer
# and set implementation = "gstreamer"
implementation = "gstreamer"
# Used by h264-dump only
output = "dump.h264"
