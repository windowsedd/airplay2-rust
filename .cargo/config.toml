# Workspace cargo config — plain `cargo run` builds airplay-app with GStreamer.
#
# Windows GStreamer: pkg-config.exe lives in GStreamer bin. These env vars apply
# when you run cargo from this workspace (override by setting them yourself first).

[alias]
run-airplay = "run -p airplay-app"
build-airplay = "build -p airplay-app --release"

[env]
# Default MSVC x86_64 install path (GStreamer 1.x)
GSTREAMER_1_0_ROOT_MSVC_X86_64 = { value = "C:\\Program Files\\gstreamer\\1.0\\msvc_x86_64", force = false }
PKG_CONFIG_PATH = { value = "C:\\Program Files\\gstreamer\\1.0\\msvc_x86_64\\lib\\pkgconfig", force = false }
# So build scripts find pkg-config.exe next to gstreamer-1.0.pc
PATH = { value = "C:\\Program Files\\gstreamer\\1.0\\msvc_x86_64\\bin", prepend = true, force = false }
