# Workspace cargo aliases — plain `cargo run` already starts airplay-app
# (see workspace default-members). These make intent explicit.
[alias]
# cargo run-airplay  →  same as cargo run -p airplay-app
run-airplay = "run -p airplay-app"
# cargo build-airplay  →  release .exe with default features (auto player)
build-airplay = "build -p airplay-app --release"
